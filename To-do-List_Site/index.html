<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicons/icons8-lista-de-tarefas-cute-color-96.png" type="image/x-icon">
    <title>To-Do Focus</title>
</head>
<body>

    <header>
        <h1>To-Do Focus</h1>
    </header>

    <main>


        <section id="pomodoro-section">
            <h2> Temporizador Pomodoro</h2>

            <div id="timer-display">25:00</div>

            <div class="pomodoro-controls">
            <button id="start-btn" class="btn">Iniciar</button>
            <button id="reset-btn" class="btn">Resetar</button>
            <button id="pause-btn" class="btn">Pausar</button>
            </div>
        </section>

        <section id="todo-section">
            <h2>Tarefas Atuais</h2>
            
            <div class="input-group">
                <input 
                id="task-input" 
                type=text 
                placeholder="Digite uma nova tarefa" 
                autocomplete="off"/>
                
                <button 
                id="add-task-btn" class="btn">Adicionar</buttonid>
                </button>
            </div>

        </section>


    </main>
</body>
</html>
